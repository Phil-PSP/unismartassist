{% extends 'base.html' %}
{% block title %}Add User — Admin{% endblock %}
{% block page_title %}Add New User{% endblock %}
{% block page_subtitle %}Create a student, staff, or admin account{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="card">
    <form method="post" class="space-y-5" x-data="{role:'student'}">
      {% csrf_token %}
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold mb-1" style="color:var(--muted)">First Name</label>
          <input name="first_name" type="text" class="form-input" required>
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1" style="color:var(--muted)">Last Name</label>
          <input name="last_name" type="text" class="form-input" required>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold mb-1" style="color:var(--muted)">User ID</label>
          <input name="user_id" type="text" class="form-input font-mono" placeholder="e.g. STU/2024/010" required>
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1" style="color:var(--muted)">Role</label>
          <select name="role" class="form-input" x-model="role">
            <option value="student">Student</option>
            <option value="staff">Staff</option>
            <option value="admin">Admin</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1" style="color:var(--muted)">Email</label>
        <input name="email" type="email" class="form-input" required>
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1" style="color:var(--muted)">Password</label>
        <input name="password" type="password" class="form-input" placeholder="Min 6 characters" required>
      </div>

      <!-- Student-only fields -->
      <div x-show="role === 'student'" x-cloak class="grid grid-cols-2 gap-4 p-4 rounded-xl" style="background:var(--bg);border:1px solid var(--border)">
        <div>
          <label class="block text-xs font-semibold mb-1" style="color:var(--muted)">Programme</label>
          <select name="programme" class="form-input">
            <option value="">— Select Programme —</option>
            {% for prog in programmes %}
            <option value="{{ prog.id }}">{{ prog.name }} ({{ prog.department.code }})</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1" style="color:var(--muted)">Level</label>
          <select name="level" class="form-input">
            <option value="100">Level 100</option>
            <option value="200">Level 200</option>
            <option value="300">Level 300</option>
            <option value="400">Level 400</option>
          </select>
        </div>
      </div>

      <div class="flex gap-3 pt-2">
        <button type="submit" class="btn btn-primary flex-1">Create User</button>
        <a href="{% url 'admin_users' %}" class="btn btn-secondary flex-1 text-center">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
